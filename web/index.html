<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="AcadeGate — بوابة الدراسات العليا والبحث الأكاديمي: مشرفون، مختبرات، متجر، كتابة، نشر وتمويل.">
  <meta name="robots" content="noindex, follow">

  <!-- Open Graph — معاينة واتساب / فيسبوك / تلغرام -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AcadeGate">
  <meta property="og:title" content="AcadeGate — بوابة الدراسات العليا">
  <meta property="og:description" content="منصة أكاديمية للباحثين: مشرفون، مختبرات، متجر، كتابة بشرية، نشر وتمويل بحثي.">
  <meta property="og:url" content="https://acadegate-new.web.app/">
  <meta property="og:locale" content="ar_AR">
  <meta property="og:image" content="https://acadegate-new.web.app/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="AcadeGate — بوابة الدراسات العليا">
  <meta name="twitter:description" content="منصة أكاديمية للباحثين: مشرفون، مختبرات، متجر، كتابة، نشر وتمويل.">
  <meta name="twitter:image" content="https://acadegate-new.web.app/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AcadeGate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>AcadeGate</title>
  <style>
    #ag-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #0b1437;
      color: #f4f7fb;
      font-family: Arial, sans-serif;
      font-size: 15px;
      letter-spacing: 0.4px;
      z-index: 9999;
    }
    #ag-loader .spin {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 4px solid rgba(244, 247, 251, 0.18);
      border-top-color: #26c6da;
      animation: agspin 0.9s linear infinite;
    }
    @keyframes agspin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="ag-loader">
    <img src="icons/Icon-192.png" width="72" height="72" alt="AcadeGate">
    <div class="spin"></div>
    <div>AcadeGate | أكاديجيت</div>
  </div>
  <script>
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
      } catch (e) {}
      window.addEventListener('flutter-first-frame', function () {
        var el = document.getElementById('ag-loader');
        if (el) el.remove();
      });
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js?v=20261101';
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
