name: acadegate
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  google_sign_in: ^7.2.0
  http: ^1.4.0
  cloud_functions: ^6.0.5
  xml: ^6.5.0
  url_launcher: ^6.3.1
  file_picker: ^10.1.9
  firebase_storage: ^13.0.0
  image_picker: ^1.1.2
  firebase_messaging: ^16.0.0
  crypto: ^3.0.6
  shared_preferences: ^2.5.3
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  record: ^7.1.0
  pdf: ^3.12.0
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  printing: ^5.14.3
  archive: ^4.0.9
  html: ^0.15.6
  flutter_facebook_auth: ^7.1.8
  sign_in_with_apple: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/acadegate_logo.png
    - assets/images/acadegate_logo_2x.png
    - assets/images/supervisors_card.png
    - assets/images/
    - seed_data/csv/
    - seed_data/universities/
